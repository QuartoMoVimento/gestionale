project_id = "gestionale"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.ssl_enforcement]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://gestionale.quartomovimento.it/"
additional_redirect_urls = [
  "https://gestionale.quartomovimento.it/",
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
anonymous_users = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
# Le famiglie possono non aprire subito la mail automatica: un'ora non basta e
# il genitore trovava il link gia scaduto. Sette giorni sono 604800 secondi.
# Supabase sconsiglia valori superiori a un giorno: questa scelta e intenzionale
# per lasciare alle famiglie una settimana completa per usare l'invito.
otp_expiry = 604800

[auth.email.template.invite]
subject = "Il tuo accesso a Quarto MoVimento"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Benvenut@ nell'area riservata di Quarto MoVimento"
content_path = "./supabase/templates/confirmation.html"

# Come per l'invito: il link di default di Supabase (ConfirmationURL) punta a
# /auth/v1/verify e brucia il token al primo GET, anche se a farlo e' uno
# scanner di sicurezza della posta invece della persona. Questi due template
# usano TokenHash e rimandano all'app, che spende il token lato browser con
# auth.verifyOtp() (vedi assets/js/app.js, readAuthTicket/verifyOtp in init()).
[auth.email.template.magic_link]
subject = "Il tuo nuovo accesso a Quarto MoVimento"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Reimposta la tua password – Quarto MoVimento"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[functions.invite-family]
verify_jwt = false

[functions.paypal-create-order]
verify_jwt = false

[functions.paypal-capture-order]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false
