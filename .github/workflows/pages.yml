name: Pubblica su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file statici
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html manifest.webmanifest _site/
          cp -R assets _site/assets
          if [[ -f CNAME ]]; then
            cp CNAME _site/
          fi

      - name: Genera la configurazione pubblica
        shell: bash
        env:
          SUPABASE_URL_OVERRIDE: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY_OVERRIDE: ${{ vars.SUPABASE_ANON_KEY }}
          PAYPAL_CLIENT_ID: ${{ vars.PAYPAL_CLIENT_ID }}
          PAYPAL_ENVIRONMENT: ${{ vars.PAYPAL_ENVIRONMENT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");

          const configPath = "_site/assets/js/config.js";
          const sandbox = { window: Object.create(null) };
          const context = vm.createContext(sandbox, {
            codeGeneration: { strings: false, wasm: false },
          });
          const source = fs.readFileSync(configPath, "utf8");
          new vm.Script(source, { filename: configPath }).runInContext(context, {
            timeout: 1000,
          });
          const versionedConfig = sandbox.window.QM_CONFIG;
          if (!versionedConfig || typeof versionedConfig !== "object") {
            throw new Error(
              "assets/js/config.js non definisce window.QM_CONFIG.",
            );
          }

          const publicString = (name, fallback = "") => {
            const value = versionedConfig[name];
            return typeof value === "string" ? value.trim() : fallback;
          };

          const defaultSupabaseUrl = publicString("supabaseUrl");
          const defaultSupabaseAnonKey = publicString("supabaseAnonKey");
          const supabaseUrlOverride =
            (process.env.SUPABASE_URL_OVERRIDE || "").trim();
          const supabaseAnonKeyOverride =
            (process.env.SUPABASE_ANON_KEY_OVERRIDE || "").trim();

          function requireCompletePair(url, key, label) {
            if (Boolean(url) !== Boolean(key)) {
              throw new Error(
                `${label}: SUPABASE_URL e SUPABASE_ANON_KEY devono essere configurate insieme.`,
              );
            }
          }

          function validateSupabaseUrl(url, label) {
            if (!url) return;
            let parsed;
            try {
              parsed = new URL(url);
            } catch {
              throw new Error(`${label}: SUPABASE_URL non è un URL valido.`);
            }
            if (
              parsed.protocol !== "https:" ||
              parsed.username ||
              parsed.password ||
              parsed.search ||
              parsed.hash ||
              (parsed.pathname !== "/" && parsed.pathname !== "")
            ) {
              throw new Error(
                `${label}: SUPABASE_URL deve essere una origine HTTPS senza credenziali, percorso, query o frammento.`,
              );
            }
          }

          function validateSupabaseKey(key, label) {
            if (!key) return;
            const normalizedKey = key.toLowerCase();
            if (normalizedKey.startsWith("sb_secret_")) {
              throw new Error(
                `${label}: SUPABASE_ANON_KEY contiene una secret key; pubblicazione bloccata.`,
              );
            }

            if (key.startsWith("sb_publishable_")) {
              const suffix = key.slice("sb_publishable_".length);
              if (!/^[A-Za-z0-9_-]{20,}$/.test(suffix)) {
                throw new Error(
                  `${label}: SUPABASE_ANON_KEY publishable non è valida.`,
                );
              }
            } else {
              const segments = key.split(".");
              if (segments.length !== 3) {
                throw new Error(
                  `${label}: SUPABASE_ANON_KEY non è una publishable key né una legacy anon JWT valida.`,
                );
              }

              let payload;
              try {
                payload = JSON.parse(
                  Buffer.from(segments[1], "base64url").toString("utf8"),
                );
              } catch {
                throw new Error(
                  `${label}: impossibile verificare il ruolo della legacy SUPABASE_ANON_KEY.`,
                );
              }

              if (payload.role !== "anon") {
                throw new Error(
                  `${label}: SUPABASE_ANON_KEY non ha ruolo anon; pubblicazione bloccata.`,
                );
              }
            }
          }

          requireCompletePair(
            defaultSupabaseUrl,
            defaultSupabaseAnonKey,
            "Configurazione versionata",
          );
          validateSupabaseUrl(
            defaultSupabaseUrl,
            "Configurazione versionata",
          );
          validateSupabaseKey(
            defaultSupabaseAnonKey,
            "Configurazione versionata",
          );
          requireCompletePair(
            supabaseUrlOverride,
            supabaseAnonKeyOverride,
            "Override GitHub Variables",
          );
          validateSupabaseUrl(
            supabaseUrlOverride,
            "Override GitHub Variables",
          );
          validateSupabaseKey(
            supabaseAnonKeyOverride,
            "Override GitHub Variables",
          );

          const usesOverride = Boolean(
            supabaseUrlOverride && supabaseAnonKeyOverride,
          );
          const supabaseUrl = usesOverride
            ? supabaseUrlOverride
            : defaultSupabaseUrl;
          const supabaseAnonKey = usesOverride
            ? supabaseAnonKeyOverride
            : defaultSupabaseAnonKey;
          const paypalClientId =
            (process.env.PAYPAL_CLIENT_ID || "").trim() ||
            publicString("paypalClientId");
          const paypalEnvironment = (
            (process.env.PAYPAL_ENVIRONMENT || "").trim() ||
            publicString("paypalEnvironment", "sandbox")
          ).toLowerCase();

          if (!["sandbox", "live"].includes(paypalEnvironment)) {
            throw new Error(
              "PAYPAL_ENVIRONMENT deve essere 'sandbox' oppure 'live'.",
            );
          }

          if (!supabaseUrl) {
            console.log(
              "::warning::SUPABASE_URL e SUPABASE_ANON_KEY non impostate: pubblicazione in modalità demo.",
            );
          }

          if (!paypalClientId) {
            console.log(
              "::notice::PAYPAL_CLIENT_ID non impostato: il pagamento PayPal resterà disabilitato.",
            );
          }

          const config = {
            supabaseUrl,
            supabaseAnonKey,
            paypalClientId,
            paypalCurrency: publicString("paypalCurrency", "EUR"),
            paypalEnvironment,
            siteName: publicString(
              "siteName",
              "Area corsi · Quarto MoVimento",
            ),
            supportEmail: publicString("supportEmail"),
            supportPhone: publicString("supportPhone"),
            websiteUrl: publicString("websiteUrl"),
          };

          const output = [
            "/* Generato da GitHub Actions: contiene solo valori pubblici. */",
            `window.QM_CONFIG = ${JSON.stringify(config, null, 2)};`,
            "",
          ].join("\n");

          fs.writeFileSync(configPath, output, "utf8");
          NODE

      - name: Verifica l'artefatto
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "_site/index.html"
            "_site/404.html"
            "_site/manifest.webmanifest"
            "_site/assets/css/styles.css"
            "_site/assets/fonts/nunito-latin.woff2"
            "_site/assets/fonts/rochester-latin.woff2"
            "_site/assets/img/logo-quarto-movimento-192.png"
            "_site/assets/img/logo-quarto-movimento.png"
            "_site/assets/img/logo-quarto-movimento-full.png"
            "_site/assets/js/config.js"
            "_site/assets/js/demo-data.js"
            "_site/assets/js/app.js"
          )

          for required_file in "${required_files[@]}"; do
            test -s "$required_file" || {
              echo "::error file=$required_file::File statico mancante o vuoto"
              exit 1
            }
          done

      - name: Carica l'artefatto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
